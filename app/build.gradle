plugins {
    id 'com.android.application'
}

android {
    namespace 'pe.ecocentury.asistencia'
    compileSdk 34

    defaultConfig {
        applicationId 'pe.ecocentury.asistencia'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '2.0'
    }

    // Firma fija: permite actualizar la app sin desinstalarla
    signingConfigs {
        ecocentury {
            storeFile file('ecocentury.keystore')
            storePassword 'ecocentury2026'
            keyAlias 'ecocentury'
            keyPassword 'ecocentury2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.ecocentury
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.ecocentury
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
